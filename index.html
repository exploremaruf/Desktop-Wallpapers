<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Wallpapers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Desktop Wallpapers</h1>
      <p>Browse, preview, and download your favorite wallpaper.</p>
      <input id="searchInput" type="search" placeholder="Search wallpapers..." aria-label="Search wallpapers" />
    </header>

    <main>
      <p id="countText" class="count"></p>
      <section id="gallery" class="gallery" aria-live="polite"></section>
    </main>

    <dialog id="previewDialog" class="preview-dialog">
      <button id="closePreview" class="close-btn" type="button" aria-label="Close preview">×</button>
      <img id="previewImage" alt="Wallpaper preview" />
      <div class="preview-actions">
        <a id="previewDownload" class="download-btn" download>Download</a>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
